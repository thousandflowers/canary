name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: go (${{ matrix.os }})
    # Both, always: the bird runs on a Mac laptop and a Linux server, and the
    # only bugs worth catching here are the ones that differ between them.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        # -race on Linux only: the statusline writes state files that Claude
        # Code can run concurrently, and the race detector is the cheapest way
        # to keep that honest. It roughly doubles the run, so once is enough.
        run: |
          if [ "${{ matrix.os }}" = ubuntu-latest ]; then
            go test -race ./...
          else
            go test ./...
          fi
      - name: coverage must be total
        # 100%, enforced. Not because a number is the point, but because the
        # branches that go uncovered in a tool like this are exactly the ones
        # that matter: the unreadable file, the read-only directory, the
        # settings.json somebody hand-edited. Ubuntu only — one canonical
        # environment is enough for a gate, and the mode-based failure
        # injection needs a non-root user.
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test ./... -coverprofile=cover.out -coverpkg=./... >/dev/null
          go tool cover -func=cover.out | tail -1
          uncovered=$(go tool cover -func=cover.out | awk '$1 != "total:" && $3 != "100.0%"')
          if [ -n "$uncovered" ]; then
            echo "not covered:"
            echo "$uncovered"
            exit 1
          fi
      - name: lint the corpus
        # The same checks the test suite runs, through the command a contributor
        # uses. A phrase PR should fail here, visibly, rather than inside a Go
        # test somebody has to go and read.
        run: go run ./cmd/canary lint

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        # Pinned, not apt. Different shellcheck releases disagree about which
        # findings are worth reporting — 0.11 dropped an SC2015 that 0.9 flags —
        # so an unpinned linter turns "CI is green" into a function of whatever
        # the runner image shipped that week. Bump this deliberately.
        env:
          SC_VERSION: v0.10.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SC_VERSION}/shellcheck-${SC_VERSION}.linux.x86_64.tar.xz" \
            | sudo tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-${SC_VERSION}/shellcheck"
          shellcheck --version
      - name: lint the scripts that are left
        # The installer is the only shell canary still ships: a `curl | sh`
        # bootstrap cannot be written in the language it is bootstrapping.
        run: shellcheck -x install.sh uninstall.sh test_install_uninstall.sh

  shells:
    name: shells (${{ matrix.os }})
    # macOS ships bash 3.2, Ubuntu ships bash 5.x. The hooks the binary prints
    # have to work in both, and only a real shell can prove that.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: bash version
        run: bash --version | head -1
      - name: install / uninstall
        run: bash test_install_uninstall.sh
      - name: build
        run: go build -o /tmp/canary ./cmd/canary
      - name: bash hook draws the bird
        run: |
          rc=$(mktemp)
          /tmp/canary init bash > "$rc"
          out=$(printf 'echo hi\nexit\n' | env HOME="$(mktemp -d)" bash --rcfile "$rc" -i 2>&1)
          printf '%s\n' "$out"
          case "$out" in
            *'▐ O ▌>'*) echo "bash ok" ;;
            *) echo "bash hook did not draw"; exit 1 ;;
          esac
      - name: zsh hook draws the bird
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zsh
          fi
          zdot=$(mktemp -d)
          /tmp/canary init zsh > "$zdot/.zshrc"
          echo 'PS1="%% "' >> "$zdot/.zshrc"
          out=$(printf 'echo hi\nexit\n' | env HOME="$(mktemp -d)" ZDOTDIR="$zdot" zsh -i 2>&1)
          printf '%s\n' "$out"
          case "$out" in
            *'▐ O ▌>'*) echo "zsh ok" ;;
            *) echo "zsh hook did not draw"; exit 1 ;;
          esac

  fish:
    name: fish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install fish
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fish
      - name: fish version
        run: fish --version
      - name: build
        run: go build -o /tmp/canary ./cmd/canary
      - name: syntax check
        run: /tmp/canary init fish > /tmp/hook.fish && fish --no-execute /tmp/hook.fish
      - name: fish hook draws the bird
        # `-i` matters: the hook is guarded on `status is-interactive`, and fish
        # run with -c alone is not.
        run: |
          out=$(env HOME="$(mktemp -d)" fish --no-config -i -c "source /tmp/hook.fish; emit fish_preexec 'git status'; fish_prompt" 2>&1)
          printf '%s\n' "$out"
          case "$out" in
            *'▐ O ▌>'*) echo "fish ok" ;;
            *) echo "fish hook did not draw"; exit 1 ;;
          esac
