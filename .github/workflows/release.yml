name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser builds the changelog from history; a shallow clone gives
          # it one commit and a release note that says nothing.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tests must pass before anything is published
        run: go test ./...
      - name: check the tap token exists
        # goreleaser fails at the very END without it, after the release is
        # already public — leaving the taps behind and the release note live.
        # Fail here instead, before anything is published.
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          if [ -z "$TAP_PUSH_TOKEN" ]; then
            echo "TAP_PUSH_TOKEN is not set: goreleaser cannot push to the Homebrew taps."
            echo "Create a fine-grained PAT scoped to thousandflowers/homebrew-tap alone,"
            echo "with Contents: read and write, then add it as a repository secret."
            echo "One tap: .goreleaser.yml pushes only there, and it is what the README"
            echo "tells users to install from. homebrew-canary is the retired hand-bumped"
            echo "copy and needs no token."
            exit 1
          fi
      - name: use the notes written for this tag, if there are any
        # goreleaser's generated changelog is a list of commit subjects. That is
        # the right default, and the wrong thing for a release anybody has to
        # read. A tag with .github/release-notes/<tag>.md ships that instead;
        # one without falls back to the generated list, so nothing has to be
        # written for a patch release that does not need it.
        id: notes
        run: |
          file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$file" ]; then
            echo "using $file"
            echo "args=--release-notes=$file" >> "$GITHUB_OUTPUT"
          else
            echo "no notes for ${GITHUB_REF_NAME}; goreleaser will build a changelog"
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
